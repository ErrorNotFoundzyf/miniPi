name: Agent regression

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  offline:
    name: Offline regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.9.29'
          python-version: '3.12'
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Build TUI and verify Escape through the real kernel
        run: |
          npm ci --no-audit --no-fund
          npm run build
          MINIPI_E2E_PYTHON="$PWD/.venv/bin/python" node --test my-pi-tui/test/escape-e2e.test.js
      - name: Run deterministic evaluation tests
        run: |
          uv run --no-sync python -m pytest tests/eval \
            tests/coding/test_bash_tool.py::test_bash_token_only_terminates_an_active_process_once
      - name: Replay scripted cases
        run: |
          uv run --no-sync python my-pi-eval/scripts/run_regression.py run \
            --case my-pi-eval/cases/fresh-verification \
            --case my-pi-eval/cases/bash-pipefail \
            --output .my_agent_core/ci-offline
      - name: Upload offline scorecard
        if: '!cancelled()'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-regression
          path: |
            .my_agent_core/ci-offline/manifest.json
            .my_agent_core/ci-offline/scorecard.json
            .my_agent_core/ci-offline/attempts/*/*/*/result.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 14

